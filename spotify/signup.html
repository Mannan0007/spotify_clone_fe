<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="signup.css">
    <title>Sign Up Spotify</title>
    <link rel="icon" href="/images/icons8-spotify-50.png" />

</head>
<body>
    <main>
        <section id="sign-up-form">
            <img src="/images/Spotify_Logo_CMYK_White.png" alt="logo" style="height: 40px;">
            <div class="form-wrapper">
                <h1 style="font-weight: bolder;font-size: 40px;">Sign up to start listening</h1>
               
                <form>
                    <label>Email address</label> 
                    <input type="email" placeholder="name@domain.com" style="color: white;">
                    <div class="line">
                    <a href="#">use phone number instead</a>
                </div>
                <a href=" ">
                    <button style="color:black" class="sign-up-btn">Next</button>
                </a>
                <div class="divider">
                    <div></div>
                    <p>or</p>
                    <div></div>
                </div>
                <div class="google">

                    <img src="https://img.icons8.com/fluency/48/000000/google-logo.png" alt="" style="height: 24px; position: relative;right: -12px;bottom: -45px;">
                    <button >Sign Up with Google</button>
                    <div class="facebook">
                        <img src="https://img.icons8.com/fluency/48/000000/facebook-new.png" style="height: 24px; position: relative;right: -12px;bottom: -45px;">
                        <button >Sign Up with Facebook</button>
                    </div>

                    <div class="apple">
                        <img src="https://img.icons8.com/color/48/000000/mac-os--v1.png"  style="height: 24px; position: relative;right: -12px;bottom: -45px;">
                        <button > Sign Up with Apple</button>
                    </div>
                </div>
                    <div class="divider" style="position: relative;top: -39px;">
                        <div></div>
                    </div>
                    <div class="already">
                        <p>Already have an account? <a href="/login.html">Log in here</a></p>
                    </div>
                    <div class="footer">
                        <p>This site is protected by reCAPTCHA and the Google
                            <a href="#" >Privacy Policy </a> and <a href="#">Terms of Service apply </a></p>
                    </div> 
            </div>
        </form>
        </section>
    </main>
</body>
</html>
